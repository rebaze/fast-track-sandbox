# Stand-in agent credential: the GITHUB_TOKEN (an App token without the
# workflows permission) pushes a branch. The org does not let Actions open
# pull requests, so a person opens them.
name: agent
on:
  workflow_dispatch:
    inputs:
      branch: { required: true }
      file: { required: true }
      content: { required: true }
permissions:
  contents: write
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit and push
        env:
          BRANCH: ${{ inputs.branch }}
          FILE: ${{ inputs.file }}
          CONTENT: ${{ inputs.content }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          mkdir -p "$(dirname "$FILE")"; printf '%s\n' "$CONTENT" >> "$FILE"
          git add -A; git commit -m "Agent change to $FILE"
          git push origin "$BRANCH"
